# QLoRA-конфиг: ТОЛЬКО персона Тасочки, щадящий режим.
# Запуск: bash finetune/train_persona.sh
#
# Философия (почему так, а не как в qlora_config.yaml):
#   Gemma 3 4B уже отлично знает русский и умеет отвечать на вопросы. Учить её
#   этому заново бессмысленно и даже вредно (портит связность). Единственное,
#   чего она знать не может — что её зовут Тасочка, создал Иван, и она не Gemma.
#   Поэтому здесь всё настроено МЯГКО, чтобы вшить личность и НЕ сломать модель:
#
#   - num_layers 16  — LoRA не на все 34 слоя, а на 16 верхних. Личности этого
#                      с запасом хватает, а риск деградации ниже.
#   - rank 8         — маленький адаптер (персона — это немного информации).
#   - learning_rate 3e-5 + короткий прогон 600 итераций — персона усваивается
#                      быстро, дольше учить нечему, только переобучаться.
#   - mask_prompt    — лосс только по ответам ассистента.
#   Датасет (data_persona) ~40% персона + балласт из реальных диалогов, чтобы
#   модель не «зациклилась» на person'е и осталась нормальным собеседником.

model: mlx-community/gemma-3-4b-it-qat-4bit
train: true
fine_tune_type: lora
optimizer: adamw
data: finetune/data_persona
adapter_path: finetune/adapters_persona
seed: 42

num_layers: 16
batch_size: 2
grad_accumulation_steps: 4
iters: 600
max_seq_length: 1024

learning_rate: 3.0e-5
lr_schedule:
  name: cosine_decay
  warmup: 60
  warmup_init: 1.0e-7
  arguments: [3.0e-5, 540, 3.0e-6]  # [начальный LR, шагов затухания, конечный LR]

lora_parameters:
  rank: 8
  scale: 16.0
  dropout: 0.05

mask_prompt: true
grad_checkpoint: true

steps_per_report: 20
steps_per_eval: 100
val_batches: 25
save_every: 100
